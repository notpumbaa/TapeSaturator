name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (AU + VST3, Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP-Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc signieren
        run: |
          ART=build/TapeSaturator_artefacts/Release
          codesign --force --deep --sign - "$ART/VST3/TapeSaturator.vst3"
          codesign --force --deep --sign - "$ART/AU/TapeSaturator.component"
          codesign --force --deep --sign - "$ART/Standalone/TapeSaturator.app"

      - name: AU validieren (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/TapeSaturator_artefacts/Release/AU/TapeSaturator.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Tsat Ntpb

      - name: VST3 validieren (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate build/TapeSaturator_artefacts/Release/VST3/TapeSaturator.vst3

      - name: Paketieren
        run: |
          ART=build/TapeSaturator_artefacts/Release
          mkdir -p dist
          ditto -c -k --keepParent "$ART/VST3/TapeSaturator.vst3"      dist/TapeSaturator-macOS-VST3.zip
          ditto -c -k --keepParent "$ART/AU/TapeSaturator.component"   dist/TapeSaturator-macOS-AU.zip
          ditto -c -k --keepParent "$ART/Standalone/TapeSaturator.app" dist/TapeSaturator-macOS-Standalone.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TapeSaturator-macOS
          path: dist/*.zip

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP-Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: VST3 validieren (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests `
            --validate build/TapeSaturator_artefacts/Release/VST3/TapeSaturator.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paketieren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/TapeSaturator_artefacts/Release/VST3/TapeSaturator.vst3 -DestinationPath dist/TapeSaturator-Windows-VST3.zip
          Compress-Archive -Path build/TapeSaturator_artefacts/Release/Standalone/TapeSaturator.exe -DestinationPath dist/TapeSaturator-Windows-Standalone.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TapeSaturator-Windows
          path: dist/*.zip
