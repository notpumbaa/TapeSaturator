name: Build

on:
  push:
    branches: ["**"]   # nur Branches – Tags werden über das Release-Event gebaut
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag, an das die ZIPs angehängt werden (leer = nur bauen)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (AU + VST3, Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP-Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc signieren
        run: |
          ART=build/TapeSaturator_artefacts/Release
          codesign --force --deep --sign - "$ART/VST3/TapeSaturator.vst3"
          codesign --force --deep --sign - "$ART/AU/TapeSaturator.component"
          codesign --force --deep --sign - "$ART/Standalone/TapeSaturator.app"

      - name: AU validieren (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/TapeSaturator_artefacts/Release/AU/TapeSaturator.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Tsat Ntpb

      - name: VST3 validieren (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate build/TapeSaturator_artefacts/Release/VST3/TapeSaturator.vst3

      - name: Paketieren (inkl. Lizenzen)
        run: |
          ART=build/TapeSaturator_artefacts/Release
          packaging/stage-docs.sh build/_deps/juce-src docs-stage "${RELEASE_TAG:-$GITHUB_SHA}"
          mkdir -p dist stage
          pack() {  # $1 = Plugin-Bundle, $2 = ZIP-Name ohne .zip
            mkdir -p "stage/$2"
            ditto "$1" "stage/$2/$(basename "$1")"
            cp -R docs-stage/. "stage/$2/"
            ditto -c -k --keepParent "stage/$2" "dist/$2.zip"
          }
          pack "$ART/VST3/TapeSaturator.vst3"      TapeSaturator-macOS-VST3
          pack "$ART/AU/TapeSaturator.component"   TapeSaturator-macOS-AU
          pack "$ART/Standalone/TapeSaturator.app" TapeSaturator-macOS-Standalone

      - name: ZIP-Inhalt prüfen
        run: |
          for z in dist/*.zip; do
            unzip -l "$z"
            for f in LICENSE.txt README.txt THIRD-PARTY-NOTICES.txt third-party-licenses/JUCE-LICENSE.md; do
              unzip -l "$z" | grep -q "/$f\$" || { echo "::error::$f fehlt in $z"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: TapeSaturator-macOS
          path: dist/*.zip

      - name: An Release anhängen
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP-Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: VST3 validieren (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests `
            --validate build/TapeSaturator_artefacts/Release/VST3/TapeSaturator.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lizenzen bereitstellen
        shell: bash
        run: packaging/stage-docs.sh build/_deps/juce-src docs-stage "${RELEASE_TAG:-$GITHUB_SHA}"

      - name: Paketieren (inkl. Lizenzen)
        shell: pwsh
        run: |
          $ART = "build/TapeSaturator_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          function Pack($item, $name) {
            $dir = "stage/$name"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item -Recurse $item $dir
            Copy-Item -Recurse docs-stage/* $dir
            Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          }
          Pack "$ART/VST3/TapeSaturator.vst3"           "TapeSaturator-Windows-VST3"
          Pack "$ART/Standalone/TapeSaturator.exe"      "TapeSaturator-Windows-Standalone"

      - name: ZIP-Inhalt prüfen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($z in Get-ChildItem dist/*.zip) {
            $zip = [IO.Compression.ZipFile]::OpenRead($z.FullName)
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            $zip.Dispose()
            Write-Host "== $($z.Name)"; $names | ForEach-Object { Write-Host "  $_" }
            foreach ($f in 'LICENSE.txt', 'README.txt', 'THIRD-PARTY-NOTICES.txt', 'third-party-licenses/JUCE-LICENSE.md') {
              if (-not ($names | Where-Object { $_.EndsWith("/$f") })) { Write-Error "$f fehlt in $($z.Name)"; exit 1 }
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: TapeSaturator-Windows
          path: dist/*.zip

      - name: An Release anhängen
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
